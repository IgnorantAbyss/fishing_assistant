data:
  session_root: assets/replay/sessions
  legacy_dataset_root: datasets/fishing_v2
  prompt_dataset_root: datasets/prompt_observation_v1
  dataset_version: prompt_observation_v1
  development_sessions:
    - session_20260710_130308
    - session_20260710_131254
  final_test:
    status: not_collected
    sessions: []

runtime_constraints:
  resolution:
    width: 2560
    height: 1440
  ui_scale: fixed
  language: zh-TW
  window_mode: borderless
  prompt_position: fixed
  supported_environment_only: true

prompt:
  observer: unimplemented
  roi_status: unapproved
  roi: null
  roi_source_of_truth: pixel
  roi_review:
    session_ids:
      - session_20260709_192315
      - session_20260710_061220
      - session_20260710_123210
      - session_20260710_124419
      - session_20260710_125441
      - session_20260710_130308
      - session_20260710_131254
    excluded_trial_sessions:
      - session_20260709_192231

fusion:
  hook_strong_threshold: 0.85
  press_strong_threshold: 0.85
  get_strong_threshold: 0.85
  prompt_min_confidence: 0.80
  conflict_timeout_sec: 2.0

fsm:
  stable_frames: 2
  cast_pending_timeout_sec: 4.0
  hook_pending_timeout_sec: 3.0
  result_pending_timeout_sec: 5.0
  collect_pending_timeout_sec: 4.0
  sync_lost_timeout_sec: 2.0

prompt_polling:
  waiting_interval_seconds: 4.0
  waiting_min_seconds: 3.0
  waiting_max_seconds: 5.0
  ready_fps: 5
  result_pending_fps: 5

hook_detector:
  armed_fps: 5
  burst_fps: 25
  safe_zone_start: 0.65
  safe_zone_end: 0.85

press_detector:
  armed_fps: 5
  burst_fps: 20

get_detector:
  armed_fps: 5
  retry_interval_seconds: 0.4
  max_attempts: 12
  max_duration_seconds: 5.0

sync:
  observation_frames: 10
  minimum_consensus_ratio: 0.7
  minimum_confidence: 0.8
  timeout_sec: 5.0

safety:
  enabled: true
  emit_actions: false
  minimum_evidence_confidence: 0.8
  cooldown_sec: 0.25
