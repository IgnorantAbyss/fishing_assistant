data:
  session_root: assets/replay/sessions
  legacy_dataset_root: datasets/fishing_v2
  prompt_dataset_root: datasets/prompt_observation_v1
  dataset_version: prompt_observation_v1
  development_sessions:
    - session_20260710_130308
    - session_20260710_131254
  final_test:
    status: not_collected
    sessions: []

runtime_constraints:
  resolution:
    width: 2560
    height: 1440
  ui_scale: fixed
  language: zh-TW
  window_mode: borderless
  prompt_position: fixed
  supported_environment_only: true

prompt:
  observer: unimplemented
  roi_status: approved
  approved_candidate_id: prompt_final_candidate
  roi:
    x1: 940
    y1: 36
    x2: 1620
    y2: 100
  roi_source_of_truth: pixel
  roi_review:
    session_ids:
      - session_20260709_192315
      - session_20260710_061220
      - session_20260710_123210
      - session_20260710_124419
      - session_20260710_125441
      - session_20260710_130308
      - session_20260710_131254
    excluded_trial_sessions:
      - session_20260709_192231

fusion:
  hook_strong_threshold: 0.85
  press_strong_threshold: 0.85
  get_strong_threshold: 0.85
  prompt_min_confidence: 0.80
  conflict_timeout_sec: 2.0

fsm:
  stable_frames: 2
  cast_pending_timeout_sec: 4.0
  hook_pending_timeout_sec: 3.0
  result_pending_timeout_sec: 5.0
  collect_pending_timeout_sec: 4.0
  sync_lost_timeout_sec: 2.0

prompt_polling:
  waiting_interval_seconds: 4.0
  waiting_min_seconds: 3.0
  waiting_max_seconds: 5.0
  ready_fps: 5
  result_pending_fps: 5

hook_detector:
  armed_fps: 5
  burst_fps: 25
  safe_zone_start: 0.65
  safe_zone_end: 0.85

hook:
  divider_safety_margin_px: 10
  fallback_trigger_threshold: 0.70
  episode_timeout_sec: 12.0
  disappearance_frames_required: 2

press_detector:
  armed_fps: 5
  burst_fps: 20
  panel_confirmation_frames: 2
  panel_disappearance_frames: 2
  recorded_exit_idle_frames: 4
  panel_geometry_tolerance: 0.12
  sequence_window_frames: 5
  sequence_consensus_frames: 3
  per_key_min_aggregated_confidence: 0.68
  sequence_min_aggregated_confidence: 0.68

get_detector:
  armed_fps: 5
  panel_confirmation_frames: 2
  localizer:
    search_width_ratio: 0.94
    geometry:
      x1_min: 0.18
      x1_max: 0.42
      y1_min: 0.15
      y1_max: 0.36
      width_min: 0.55
      width_max: 0.82
      height_min: 0.48
      height_max: 0.72
      x2_min: 0.90
      y2_min: 0.70
      y2_max: 0.92
    vertical_sliding:
      x1_ratio: 0.20
      x2_ratio: 0.98
      panel_height_to_width_ratio: 0.70
      step_ratio: 0.02
      min_grid_cells: 8
      min_title_bright_ratio: 0.015
      min_button_bright_ratio: 0.012
      min_dark_ratio: 0.80
  dark_scene_fallback:
    x1_ratio: 0.26
    y1_ratio: 0.23
    y2_ratio: 0.83
    min_grid_cells: 8
    min_title_bright_ratio: 0.015
    min_button_bright_ratio: 0.012
    min_dark_ratio: 0.80
  retry_interval_seconds: 0.4
  max_attempts: 12
  max_duration_seconds: 5.0

sync:
  observation_frames: 10
  minimum_consensus_ratio: 0.7
  minimum_confidence: 0.8
  timeout_sec: 5.0

safety:
  enabled: true
  emit_actions: false
  minimum_evidence_confidence: 0.8
  cooldown_sec: 0.25
