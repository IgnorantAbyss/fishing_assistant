seed: 42

model:
  name: mobilenet_v3_small
  pretrained: true
  input_width: 320
  input_height: 96
  num_classes: 4

training:
  batch_size: 32
  head_epochs: 5
  finetune_epochs: 10
  head_learning_rate: 0.001
  finetune_learning_rate: 0.0001
  weight_decay: 0.0001
  early_stopping_patience: 4
  num_workers: 0

confidence:
  threshold_candidates:
    - 0.50
    - 0.55
    - 0.60
    - 0.65
    - 0.70
    - 0.75
    - 0.80
    - 0.85
    - 0.90
  max_validation_unknown_ratio: 0.10
